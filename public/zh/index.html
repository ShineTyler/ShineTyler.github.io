<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tyler&#x27;s Corner</title>
  <meta name="description" content="一个适合学生的中英文个人主页与博客。">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/Megrim-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="../assets/vendor/katex/katex.min.css">
  <script defer src="../assets/vendor/katex/katex.min.js"></script>
  <script defer src="../assets/vendor/katex/auto-render.min.js"></script>
  <script defer src="../assets/site.js"></script>
</head>
<body>

  <div class="intro-overlay" role="button" tabindex="0" aria-label="Press start to enter Tyler's blog">
    <div class="intro-overlay-backdrop"></div>
    <div class="intro-overlay-content">
      <h1 class="intro-overlay-title">TYLER</h1>
    </div>
    <button class="intro-overlay-prompt intro-overlay-enter" type="button" aria-label="Press start to enter">
      <span>PRESS</span><span>START</span>
    </button>
    <div class="intro-overlay-arrow" aria-hidden="true">
      <span></span>
      <span></span>
    </div>
  </div>
  <div class="site-shell">
    
    <header class="site-header">
      <a class="brand" href="../zh/">
        <span class="brand-wordmark">Tyler&apos;s Corner</span>
      </a>
      <nav class="site-nav" aria-label="主要导航">
        <a class="current" href="../zh/">首页</a>
        <a href="../zh/about/">关于</a>
        <a href="../zh/projects/">项目</a>
        <a href="../zh/blog/">博客</a>
      </nav>
      <div class="language-switch" aria-label="语言切换">
        <a href="../en/">EN</a><a class="current" href="../zh/">中文</a>
      </div>
    </header>
    <main>
      <section class="hero" data-reveal>
        <header class="hero-header">
          <h1 class="hero-title">Building, learning and growing.</h1>
          <p class="hero-subline">On the journey to becoming an excellent engineer.</p>
        </header>
        <div class="hero-body">
          <div class="hero-about">
            <p>我是 Tyler，一名尝试成为工程师的菜鸟。这个网站用来记录我的项目、笔记和思考，也用来见证我一步步走向优秀工程师的过程。</p>
            <p>这个网站用来安静地记录我正在学习和搭建的内容，以及那些把好奇心慢慢沉淀成工程能力的小步骤。</p>
          </div>
          <div class="hero-portrait">
            <div class="portrait"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
